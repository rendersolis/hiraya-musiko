<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Checkout | Hiraya Musiko</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="index.html" aria-label="Hiraya Musiko home">
          <img src="./images/hiraya-musiko-logo.png" alt="Hiraya Musiko Logo">
        </a>
        <nav class="main-nav" aria-label="Main navigation">
<a href="index.html" class="nav-link">HOME</a>
<a href="about.html" class="nav-link">ABOUT US</a>
<a href="products.html" class="nav-link">PRODUCTS</a>

<a href="reviews.html" class="nav-link">REVIEWS</a>
<a href="faq.html" class="nav-link">FAQ</a>
<a href="contact.html" class="nav-link">CONTACT US</a>
<a href="account.html" class="nav-link header-icon-link" aria-label="Account" title="Account"><svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.8 20c.7-3.8 3.2-5.7 7.2-5.7s6.5 1.9 7.2 5.7"/></svg></a>
<a href="wishlist.html" class="nav-link header-icon-link" aria-label="Wishlist" title="Wishlist"><span class="icon-wrap"><svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.8c0 5.1-8.8 10.3-8.8 10.3S3.2 13.9 3.2 8.8a4.5 4.5 0 0 1 8.8-1.3 4.5 4.5 0 0 1 8.8 1.3Z"/></svg></span><span class="header-badge" data-wishlist-count hidden></span></a>
<a href="cart.html" class="nav-link header-icon-link" aria-label="Shopping Cart" title="Shopping Cart"><span class="icon-wrap"><svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.5L22 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg></span><span class="header-badge" data-cart-count hidden></span></a>
<a href="signup.html" class="nav-link nav-button">SIGN UP</a>
<a href="login.html" class="nav-link nav-button nav-button-alt">LOGIN</a>
</nav>
      </div>
    </header>

    <main>
      <section class="info-panel">
        <div class="container">
          <h1>Checkout</h1>
          <div class="checkout-grid">
            <form class="checkout-form content-box" action="#" method="post">
              <h2>Customer Information</h2>
              <label>Full Name
                <input type="text" name="fullname" required />
              </label>
              <label>Email
                <input type="email" name="email" required />
              </label>
              <label>Contact Number
                <input type="tel" name="phone" />
              </label>
              <label>Address
                <textarea name="address"></textarea>
              </label>
              <label>City
                <input type="text" name="city" />
              </label>
              <label>Province
                <input type="text" name="province" />
              </label>
              <label>Postal Code
                <input type="text" name="postal-code" />
              </label>
              <label>Saved Address
                <select id="checkout-address-select" name="saved-address">
                  <option value="">Use a new address</option>
                </select>
              </label>
            </form>

            <aside class="order-summary content-box">
              <h2>Order Summary</h2>
              <div id="checkout-items"></div>
              <p><strong>Total: <span id="checkout-total">₱0</span></strong></p>
              <h3>Payment Method</h3>
              <fieldset class="payment-method">
                <legend>PAYMENT METHOD</legend>

                <label class="payment-option" data-payment="cod">
                  <input type="radio" name="payment" value="cod" required>
                  Cash on Delivery
                </label>

                <label class="payment-option" data-payment="gcash">
                  <input type="radio" name="payment" value="gcash">
                  GCash
                </label>

                <label class="payment-option" data-payment="maya">
                  <input type="radio" name="payment" value="maya">
                  Maya
                </label>

                <label class="payment-option" data-payment="bank-transfer">
                  <input type="radio" name="payment" value="bank-transfer">
                  Bank Transfer
                </label>

                <label class="payment-option" data-payment="credit-debit-card">
                  <input type="radio" name="payment" value="credit-debit-card">
                  Credit / Debit Card
                </label>
              </fieldset>

              <div id="checkout-message" class="form-message"></div>
              <button type="button" class="main-button">PLACE ORDER</button>
            </aside>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div>
          <h3>Hiraya Instruments</h3>
        </div>
      </div>
    </footer>
    <script src="script.js" defer></script>
  </body>
</html>
